services:
  - type: web
    name: winnetech
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn winnitech.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: winnetech-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.11.0"
databases:
  - name: winnetech-db
    plan: free
    databaseName: winnetech
    user: winnetech_user
