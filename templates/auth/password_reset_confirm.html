{% extends 'base.html' %}
{% block title %}Choose Password — WTI{% endblock %}
{% block body %}
<main class="container py-5" style="max-width:560px">
  {% if validlink %}
    <h1 class="h3">Choose a password</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary" type="submit">Set password</button>
    </form>
  {% else %}
    <h1 class="h3">Password link expired</h1>
    <p>Request a new secure password setup link.</p>
    <a class="btn btn-primary" href="{% url 'password_reset' %}">Request another link</a>
  {% endif %}
</main>
{% endblock %}
